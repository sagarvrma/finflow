name: FinFlow Daily Pipeline

on:
  schedule:
    - cron: '0 11 * * 1-5'  # 6am ET = 11am UTC, Monday-Friday
  workflow_dispatch:          # allows manual trigger from GitHub UI

jobs:
  run_pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests boto3 python-dotenv great-expectations pandas dbt-redshift psycopg2-binary

      - name: Ingest market data
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: python ingestion/ingest_market_data.py

      - name: Validate bronze data
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: python quality/validate_bronze.py

      - name: Run Glue crawler
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: python ingestion/run_glue_crawler.py

      - name: Run dbt models
        env:
          REDSHIFT_HOST: ${{ secrets.REDSHIFT_HOST }}
          REDSHIFT_PASSWORD: ${{ secrets.REDSHIFT_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          finflow_dbt:
            outputs:
              dev:
                type: redshift
                host: ${REDSHIFT_HOST}
                port: 5439
                user: admin
                password: ${REDSHIFT_PASSWORD}
                dbname: finflow_db
                schema: public
                threads: 4
                is_serverless: true
                serverless_work_group: finflow-workgroup
            target: dev
          EOF
          cd finflow_dbt
          dbt run --select stg_market_data mrt_market_summary mrt_volume_anomaly